[project]
name = "baby-feeding-mcp"
version = "1.0.0"
description = "宝宝抚养记录 MCP Server - 接入小智AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
